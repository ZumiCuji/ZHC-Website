<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education - Zumi Cuji</title>
    
    <!-- Link to the original main.css file -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <link rel="icon" href="/img/favicon.png" type="image/png">
    
    <!-- Animation & Icon Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <script src="https://code.iconify.design/1/1.0.7/iconify.min.js"></script>

    <style>
        /* This is the same block of override styles for consistency */
        
        /* --- 1. General Color & Background Changes --- */
        body {
            color: white;
            background: #181a1b;
        }

        #particles-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .projects, .skills, .contact, .footer, .education, .details-section {
            background: transparent !important;
        }
        
        .seperator-skew {
            display: none;
        }

        /* --- 2. Change Blue to Red --- */
        .text-blue { color: #DC143C !important; }
        .btn-blue, .bg-blue {
            background-color: #DC143C !important;
            border-color: #DC143C !important;
        }
        .btn-blue:hover {
            background: #a50021 !important;
            border-color: #a50021 !important;
        }
        header nav .nav-container .nav-links .link::after,
        .footer .footer-flex .footer-icon-links a:hover {
            color: #DC143C !important;
            background-color: #DC143C !important;
        }
        
        /* --- 3. Custom Styles for This Page --- */
        .details-section {
            padding: 4rem 0;
            text-align: center;
        }
        .hero-title {
            font-family: "Alfa Slab One", "Poppins";
            font-size: 2.5rem;
            line-height: 1.3;
            margin-bottom: 2rem;
        }
        #ncsu-logo {
            border-radius: 50%;
            width: 300px;
            height: 300px;
            object-fit: cover;
            display: block;
            margin: 0 auto 2rem auto;
            border: 5px solid #DC143C; /* Red border */
        }
        .work-experience {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .work-experience p {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.8;
        }
        .work-experience strong {
            font-size: 1.5rem;
        }
        .work-details {
            margin-top: 1em;
        }
        .bg-white a.text-dark-grey {
            color: #2e3031 !important;
        }
    </style>
</head>
<body>

    <div id="particles-bg"></div>

    <!-- HEADER -->
    <header id="header" style="min-height: auto; padding-bottom: 2rem;">
        <nav id="nav" data-aos="fade-in">
            <div class="container nav-container">
                <a href="index.html" id="logo"><img src="img/Logo.png" alt="Name Logo"></a>
                <ul class="hide-for-mobile nav-links flex">
                    <li><a href="index.html" class="link">Home</a></li>
                    <li><a href="about.html" class="link">About Me</a></li>
                    <li><a href="index.html#contact" class="link">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- EDUCATION DETAILS SECTION -->
    <section class="details-section">
        <div class="container" data-aos="fade-up">

            <h1 class="hero-title">Aerospace Engineering<br>Minor in Physics</h1>

            <img id="ncsu-logo" src="img/ncsu.jpg" alt="NCSU Logo">

            <div class="work-experience">
                <p>
                    <strong>North Carolina State University</strong>
                </p>
                <p class="work-details">
                    August 2021 - May 2025<br>
                    GPA: 3.1
                </p>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer id="footer" class="footer">
        <div class="container">
            <div class="footer-flex">
                <img src="img/Logo.png" alt="logo" id="logo-footer">
                <div class="footer-icon-links">
                    <a href="https://linkedin.com/in/zumi-cuji-480884289" target="_blank"><i class="fab fa-linkedin fa-2x"></i></a>
                    <a href="https://github.com/ZumiCuji" target="_blank"><i class="fab fa-github-square fa-2x"></i></a>
                    <a href="mailto:zumicuji@gmail.com"><i class="fas fa-envelope fa-2x"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <a id="backToTopBtn" class="btn-blue"><i class="fa fa-chevron-up"></i></a>

    <!-- JS Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.6.1/gsap.min.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    
    <script>
        // Initialize Particles.js and AOS
        particlesJS.load('particles-bg', './particles.json', function() {
            console.log('Background particles loaded successfully!');
        });
        AOS.init();
    </script>
    <script defer src="js/app.js"></script>

</body>
</html>
